name: Alltag

options:
  bundleIdPrefix: de.privat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Alltag:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Alltag
    settings:
      base:
        # WICHTIG: Die Bundle-ID darf sich nie ändern, sonst gehen bei Updates die Daten verloren.
        PRODUCT_BUNDLE_IDENTIFIER: de.privat.alltag
        PRODUCT_NAME: Alltag
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: NO
        SWIFT_EMIT_LOC_STRINGS: NO

schemes:
  Alltag:
    build:
      targets:
        Alltag: all
    run:
      config: Debug
    archive:
      config: Release
