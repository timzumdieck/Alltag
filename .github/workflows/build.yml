name: iOS-Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    name: Unsignierte IPA bauen
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: App bauen
        run: |
          set -o pipefail
          xcodebuild build \
            -quiet \
            -project Alltag.xcodeproj \
            -scheme Alltag \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: IPA verpacken
        run: |
          APP="build/Build/Products/Release-iphoneos/Alltag.app"
          test -d "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Alltag.ipa Payload
          ls -lh Alltag.ipa

      - name: IPA als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Alltag-ipa-${{ github.run_number }}
          path: Alltag.ipa
          retention-days: 30

      - name: Release „neueste“ aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete neueste --yes --cleanup-tag || true
          gh release create neueste Alltag.ipa \
            --target "${{ github.sha }}" \
            --title "Alltag – Build ${{ github.run_number }}" \
            --notes "Automatisch gebaut aus Commit ${{ github.sha }}. Installation über AltStore." \
            --latest
